<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Самый страшный сайт</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: background-color 0.4s, color 0.4s; 
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Стили шапки сайта */
        header {
            background-color: #f1f1f1;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.4s;
            border-bottom: 2px solid white;
        }

        body.dark-mode header {
            background-color: #2a2a2a;
        }

        .logo {
            font-weight: bold;
            font-size: 30px;
            color: black;
        }

        nav a {
            color: black;
            text-decoration: none;
            margin-left: 15px;
            font-size: 16px;
        }

        body.dark-mode nav a {
            color: #dde3ee;
        }

        /* Главная секция контента */
        main {
            flex: 1;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 {
            color: black;
            font-size: clamp(30px, 8vw, 50px);
            margin-top: 10px;
        }

        p {
            font-size: clamp(16px, 4vw, 20px);
            line-height: 1.6;
        }

        img {
            display: block;
            margin: 20px 0;
            width: 100%;
            max-width: 200px;
            height: auto;
            border-radius: 12px;
        }

        .toggle-btn {
            background-color: #e7dcdc;
            color: white;
            font-size: 16px;
            padding: 10px 20px;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            transition: 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            touch-action: manipulation; 
        }

        body.dark-mode .toggle-btn {
            background-color: #ffffff;
            color: #333333;
        }

        /* Стили подвала сайта */
        footer {
            background-color: #e9b9b9;
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #666;
            transition: background-color 0.4s;
        }

        body.dark-mode footer {
            background-color: #2a2a2a;
            color: #aaa;
        }
    </style>
</head>
<body>

    <!-- Шапка сайта -->
    <header>
        <div class="logo">MyDevLog</div>
        <!-- Блок навигации с ссылками-заглушками -->
        <nav>
            <a href="index.html">Главная</a>
    <a href="projects.html">Пострадавшие</a>
    <a href="#">Контакты</a>
        </nav>
    </header>

    <!-- Главный уникальный контент страницы -->
    <main>
        <section>
            <h1>Ghypergamy</h1>
            <p>АААААА ебать страшна</p>

            <img src="images.jfif" alt="страх">

            <br>
            <button class="toggle-btn" onclick="toggleTheme()">
                <span id="themeIcon">🌙</span> <span id="themeText">Dark theme</span>
            </button>
        </section>
    </main>

    <!-- Подвал сайта -->
    <footer>
        <div>&copy; 2016.</div>
    </footer>

    <script>
        function toggleTheme() {
            const body = document.body;
            const themeIcon = document.getElementById('themeIcon');
            const themeText = document.getElementById('themeText');

            body.classList.toggle('dark-mode');

            if (body.classList.contains('dark-mode')) {
                themeIcon.textContent = '☀️';
                themeText.textContent = 'Light theme';
            } else {
                themeIcon.textContent = '🌙';
                themeText.textContent = 'Dark theme';
            }
        }
    </script>

</body>
</html>
